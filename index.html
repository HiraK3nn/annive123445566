<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyeux anniversaire 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ====== Palette ====== */
:root{
  --term-bg:#000; --peach:#ffd9c7; --mint:#9ff0d0; --dim:#8d7fa3;
  --rose:#ffb3cb; --cream:#fff5f8; --lilac:#d9c2ff; --plum:#3a2a52;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--term-bg);overflow:hidden}

/* ====== Écran 1 : terminal ====== */
#term{position:fixed;inset:0;padding:clamp(16px,4vw,48px);display:flex;flex-direction:row;gap:32px;
  font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--peach);
  animation-fill-mode:forwards}
#log{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.line{white-space:pre-wrap;word-break:break-all}
.ok{color:var(--mint)} .dim{color:var(--dim)}
.bar{color:var(--mint)}
.cursor::after{content:"▌";animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
#gallery{width:45%;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px;overflow:auto}
#gallery figure{width:calc(50% - 6px);aspect-ratio:1;border:2px solid var(--mint);border-radius:8px;
  overflow:hidden;display:grid;place-items:center;font-size:48px;background:#000;animation:pop .35s ease-out}
#gallery img{width:100%;height:100%;object-fit:cover}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#skip{position:absolute;right:20px;top:16px;background:none;border:0;color:var(--dim);
  font:inherit;cursor:pointer;text-decoration:underline}
#skip:focus-visible{outline:2px solid var(--mint)}
#term.out{animation:tpOut 1s ease-in forwards}
@keyframes tpOut{0%{transform:none;filter:none}40%{transform:scale(1,.01);filter:brightness(4)}100%{transform:scale(0,.01);filter:brightness(4)}}

/* ====== Écran 2 : gâteau ====== */
#cake{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px;font-family:"Press Start 2P","Courier New",monospace;color:#ffe8ef;
  background:linear-gradient(rgba(20,10,35,.25),rgba(20,10,35,.25)),url("fond.jpg") center/cover no-repeat;
  image-rendering:pixelated;transition:color 1.2s}
#cake.in{display:flex;animation:tpIn 1s ease-out both}
@keyframes tpIn{0%{transform:scale(0,.01);filter:brightness(4)}60%{transform:scale(1,.01);filter:brightness(4)}100%{transform:none;filter:none}}
#night{position:absolute;inset:0;background:#241a38;opacity:0;transition:opacity 1.6s;z-index:0}
#cake.done #night{opacity:.7}
#cake.done{color:#ffe8ef}
#cake > *:not(#night):not(.confetti){position:relative;z-index:1}
#caption{text-align:center;min-height:7rem;text-shadow:3px 3px 0 #2b1b3d}
#caption h1{font-size:clamp(14px,4.2vw,26px);line-height:1.5;font-weight:400}
#caption p{font-size:clamp(8px,2.4vw,12px);line-height:1.9;max-width:36ch;margin:12px auto 0}
#svg{width:min(80vw,400px,44vh);height:auto;overflow:visible;shape-rendering:crispEdges}
#couple{height:min(24vh,200px);width:auto;image-rendering:pixelated}
.candle{cursor:pointer}
.candle:focus-visible{outline:none}
.candle:focus-visible .stick{stroke:var(--plum);stroke-width:3}
.hit{cursor:pointer}
.candle:focus-visible .hit{stroke:#ffe8ef;stroke-width:2}
.tip{animation:tip .5s steps(1) infinite}
.candle:nth-child(2n) .tip{animation-delay:-.25s}
@keyframes tip{50%{opacity:0}}
.candle.off .flame{display:none}
.smoke{fill:#e8e0f0;animation:smoke 1.2s steps(5) forwards}
@keyframes smoke{to{transform:translateY(-40px);opacity:0}}
#replay{margin-top:8px;padding:10px 14px;border:3px solid #2b1b3d;border-radius:0;background:#ff8fb1;color:#2b1b3d;font:inherit;font-size:10px;box-shadow:0 4px 0 #2b1b3d;cursor:pointer;display:none}
#cake.done #replay{display:inline-block}
.confetti{position:absolute;top:-20px;width:8px;height:8px;z-index:2;pointer-events:none;
  animation:fall steps(30) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){
  #term.out,#cake.in{animation-duration:.01s}
  .flame{animation:none} .confetti{display:none}
}
@media (max-width:700px){
  #term{flex-direction:column}
  #gallery{width:100%;max-height:40%}
  #gallery figure{width:calc(33.33% - 8px)}
}
</style>
</head>
<body>

<div id="term">
  <button id="skip">passer</button>
  <div id="log"></div>
</div>

<div id="cake">
  <div id="night"></div>
  <div id="caption"></div>
  <svg id="svg" viewBox="0 0 400 400" aria-label="Gâteau d'anniversaire"></svg>
  <img id="couple" src="nous.png" alt="Nous deux">
  <button id="replay">Rallumer les bougies</button>
</div>
<script src="balade.js"></script>
<script>
/* ==================== À PERSONNALISER ==================== */
const NAME    = "Maëlys";              // son prénom
const CANDLES = 8;                     // nombre de bougies (1 à 8)
   const PHOTOS = [
     "1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg"
   ];
const MESSAGE = "Je t'aime Maëlys. J'espère que t'as pas trouvé ca un peu nul et que t'as trouvé ça marrant quand même. C'était ça la petite surprise. Je suis désolé de pas pouvoir le fêter avec toi le jour de ton anniversaire. Je le pense souvent même si je le dis pas souvent mais je suis vraiment désolé pour tout. Merci de ne pas avoir disparue. Je suis vraiment heureux avec toi et je vais faire de mon mieux pour te rendre heureuse. Tous les moments qu'on a passé ensemble, ta sensibilité, ton sourire, ta gentillesse et ta façon d'être ouverte, c'est bateau, mais tu es tellement formidable. D'ailleurs il y a quelque chose qui me marque en ce moment, c'est à quel point on s'embrouille pas récemment. Je trouve qu'on a une très bonne synergie. Tu peux avoir confiance en toi et tes projets. Moi c'est vraiment avec toi que je suis le plus heureux et je veux que ça dure pour toujours. Je veux pouvoir être quelqu'un sur qui tu peux compter. Je sais que je ne te le montre pas toujours assez, mais je veux que tu saches à quel point tu comptes pour moi. Je suis triste de pas pouvoir fêter ça avec toi aujourd'hui, mais on se rattrape samedi. J'espère que tu vas passer une très bonne année et que tout se passera mieux dans ta vie. Joyeux anniversaire mon choubidou.";  // ton petit mot
const FROM    = "Ta destination : ton anniversaire";                              // texte de fin de chargement
/* ========================================================= */

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = $("#log");
let skipped = false, teleported = false;

/* ---------- Écran terminal ---------- */
async function typeLine(text, cls = "") {
  const p = document.createElement("div");
  p.className = "line " + cls;
  log.appendChild(p);
  if (skipped) { p.textContent = text; return p; }
  for (const ch of text) { p.textContent += ch; await sleep(8 + Math.random() * 8); }
  return p;
}

async function loadPhoto(src) {
  const name = src.split("/").pop();
  const line = await typeLine(`> chargement ${name}`);
  const bar = document.createElement("span");
  bar.className = "bar";
  line.appendChild(bar);
  let p = 0;
  while (p < 100) {
    p = Math.min(100, p + Math.random() * 22 + 6);
    bar.textContent = " [" + "█".repeat(Math.round(p / 5)).padEnd(20, "░") + "] " + Math.round(p) + "%";
    if (!skipped) await sleep(150);
  }
  line.classList.add("ok");
  const fig = document.createElement("figure");
  const img = new Image();
  img.alt = "";
  img.onload = () => fig.replaceChildren(img);
  img.onerror = () => { fig.textContent = "💗"; };
  img.src = src;
  fig.textContent = "💗";
  gallery.appendChild(fig);
}

function waitForClick() {
  return new Promise(res => {
    addEventListener("click", res, { once: true });
    addEventListener("keydown", res, { once: true });
  });
}

async function boot() {
  PHOTOS.forEach(s => { new Image().src = s; });   // précharge les photos pour la balade
  await typeLine("téléporteur pour l'anniversaire de Maëlys v8.8 — démarrage...", "dim");
  await typeLine("> vérification des coordonnées............ OK", "ok");
  await typeLine("> La chapelle-heulin............ OK", "ok");
  await typeLine("> calibrage du portail.................... OK", "ok");
  await typeLine("> recherche de la personne la plus importante...");
  await sleep(400);
  await typeLine("> 1 résultat trouvé.", "ok");
  await typeLine("> destination : Chambre de Maëlys, et plus précisément dans le lit");
  await sleep(300);
  await typeLine("> portail prêt.", "ok");
  await sleep(300);
  await typeLine("> clique n'importe où pour te téléporter", "cursor");
  await waitForClick();
  teleport();
}

function teleport() {
  if (teleported) return;
  teleported = true;
  const t = $("#term");
  t.classList.add("out");
  setTimeout(() => {
    t.style.display = "none";
    document.body.style.background = "var(--term-bg)";
    startWalk(showCake);
  }, 950);
}

$("#skip").onclick = () => { skipped = true; teleport(); };

/* ---------- Écran gâteau ---------- */
const stripes = ["#ffd166", "#8ee3c8", "#ff8fb1", "#a9c8ff"];
let remaining = CANDLES;

function buildCake() {
  const n = Math.max(1, Math.min(8, CANDLES));
  const P = 8, OUT = "#2b1b3d", FR = "#fff5f8";
  const darks = ["#d9a441", "#52b79b", "#d9648a", "#6f9ae0"];
  const R = (c, r, w, h, f) => `<rect x="${c*P}" y="${r*P}" width="${w*P}" height="${h*P}" fill="${f}"/>`;
  const sprite = (c, r, rows, pal) => rows.map((row, y) =>
    [...row].map((ch, x) => pal[ch] ? R(c + x, r + y, 1, 1, pal[ch]) : "").join("")).join("");
  const tier = (c, r, w, h, base, light, dark) =>
    R(c, r, w, h, OUT) + R(c+1, r+1, w-2, h-2, base) + R(c+1, r+1, 1, h-2, light) +
    R(c+w-3, r+1, 2, h-2, dark) + R(c+1, r+h-2, w-2, 1, dark);
  const frosting = (c, r, w) => {
    let s = R(c, r, w, 4, OUT) + R(c+1, r+1, w-2, 2, FR);
    const k = Math.floor((w - 8) / 6) + 1, x0 = c + (w - (4 + 6 * (k - 1))) / 2;
    for (let i = 0; i < k; i++) {
      const L = Math.min(i, k - 1 - i) % 2 ? 1 : 2;
      s += R(x0 + 6*i, r+3, 4, L+1, OUT) + R(x0 + 6*i + 1, r+3, 2, L, FR);
    }
    return s;
  };
  const heart = [".XX.XX.", "XhXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."];
  const hp = { X: "#ff4d6d", h: "#ffb3c1" };

  let s = R(3, 44, 44, 4, OUT) + R(4, 45, 42, 2, "#efe3f7") + R(4, 46, 42, 1, "#c9b6da");
  s += tier(6, 31, 38, 14, "#ff8fb1", "#ffb3cb", "#d9648a") + frosting(6, 31, 38);
  s += tier(11, 21, 28, 11, "#b99cf5", "#d9c2ff", "#8c6bd1") + frosting(11, 21, 28);
  [[14,29,"#ff8fb1"],[18,28,"#8ee3c8"],[22,29,"#ffd166"],[26,28,"#ff8fb1"],[30,29,"#8ee3c8"],[33,28,"#ffd166"]]
    .forEach(([c, r, f]) => s += R(c, r, 2, 1, f));
  s += sprite(10, 38, heart, hp) + sprite(33, 38, heart, hp);
  s += R(19, 38, 2, 3, OUT) + R(29, 38, 2, 3, OUT) + R(19, 38, 1, 1, "#fff") + R(29, 38, 1, 1, "#fff");
  s += R(16, 41, 3, 1, "#ff5c8a") + R(31, 41, 3, 1, "#ff5c8a");
  s += R(23, 41, 1, 1, OUT) + R(24, 42, 2, 1, OUT) + R(26, 41, 1, 1, OUT);

  for (let i = 0; i < n; i++) {
    const cx = Math.round(25 + (i - (n - 1) / 2) * 28 / (n + 1)) - 1;
    s += `
    <g class="candle" tabindex="0" role="button" aria-label="Éteindre la bougie ${i + 1}" data-x="${(cx + 1) * P}">
      <rect class="hit" x="${(cx - 1) * P}" y="${8 * P}" width="${4 * P}" height="${13 * P}" fill="transparent"/>
      ${R(cx, 15, 1, 6, stripes[i % 4])}${R(cx + 1, 15, 1, 6, darks[i % 4])}
      ${R(cx, 17, 2, 1, FR)}${R(cx, 19, 2, 1, FR)}${R(cx, 14, 1, 1, OUT)}
      <g class="flame">
        ${R(cx, 10, 2, 4, "#ff9f1c")}${R(cx, 12, 2, 2, "#ffe66d")}
        <rect class="tip" x="${(cx + (i % 2)) * P}" y="${9 * P}" width="${P}" height="${P}" fill="#ff9f1c"/>
      </g>
    </g>`;
  }
  $("#svg").innerHTML = s;
  document.querySelectorAll(".candle").forEach(c => {
    const blow = () => blowOut(c);
    c.addEventListener("click", blow);
    c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); blow(); } });
  });
}

function setCaption() {
  const cap = $("#caption");
  if (remaining > 0) {
    cap.innerHTML = `<h1>Fais un vœu ✨</h1><p>Clique sur les bougies pour les éteindre.<br>Encore ${remaining} ${remaining > 1 ? "allumées" : "allumée"}.</p>`;
  } else {
    cap.innerHTML = `<h1>Joyeux anniversaire Mon choubidou 🎂</h1><p>${MESSAGE}</p>`;
  }
}

function blowOut(c) {
  if (c.classList.contains("off")) return;
  c.classList.add("off");
  c.removeAttribute("tabindex");
  const x = +c.dataset.x;
  [[-8, 0], [0, 8], [-8, 16]].forEach(([dx, dy], k) => {
    const q = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    q.setAttribute("class", "smoke");
    q.setAttribute("x", x + dx);
    q.setAttribute("y", 80 + dy);
    q.setAttribute("width", 8);
    q.setAttribute("height", 8);
    q.style.animationDelay = k * 0.15 + "s";
    $("#svg").appendChild(q);
    setTimeout(() => q.remove(), 1600);
  });
  remaining--;
  setCaption();
  if (remaining === 0) setTimeout(celebrate, 500);
}

function celebrate() {
  $("#cake").classList.add("done");
  const colors = ["#ffb3cb", "#d9c2ff", "#ffd166", "#8ee3c8", "#a9c8ff"];
  for (let i = 0; i < 80; i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw";
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = 2.5 + Math.random() * 3 + "s";
    d.style.animationDelay = Math.random() * 1.5 + "s";
    $("#cake").appendChild(d);
    setTimeout(() => d.remove(), 8000);
  }
}

function showCake() {
  remaining = Math.max(1, Math.min(8, CANDLES));
  $("#cake").classList.remove("done");
  buildCake();
  setCaption();
  $("#cake").classList.add("in");
}

$("#replay").onclick = () => {
  remaining = Math.max(1, Math.min(8, CANDLES));
  $("#cake").classList.remove("done");
  buildCake();
  setCaption();
};

boot();
</script>
</body>
</html>
